name: Sync Canvas Academic Context

on:
  workflow_dispatch:
  schedule:
    # Four refreshes per day without hammering Canvas. Timezone-aware across DST.
    - cron: "17 6,11,16,21 * * *"
      timezone: "America/Chicago"

permissions:
  contents: write

concurrency:
  group: canvas-academic-context-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Sync Canvas calendar feed
        env:
          CANVAS_CALENDAR_FEED_URL: ${{ secrets.CANVAS_CALENDAR_FEED_URL }}
          CANVAS_TIMEZONE: America/Chicago
          CANVAS_UPCOMING_DAYS: "30"
          CANVAS_PAST_DAYS: "30"
          CANVAS_FUTURE_DAYS: "366"
          CANVAS_COURSE_ALIASES_JSON: ${{ vars.CANVAS_COURSE_ALIASES_JSON }}
        run: python integrations/canvas/sync_calendar.py

      - name: Commit changed academic context
        shell: bash
        run: |
          git config user.name "canvas-context-bot"
          git config user.email "canvas-context-bot@users.noreply.github.com"
          git add canvas/calendar.json canvas/upcoming.json canvas/sync_status.json canvas/ACADEMIC_CONTEXT.md

          if git diff --cached --quiet; then
            echo "No Canvas changes to commit."
            exit 0
          fi

          git commit -m "sync(canvas): refresh academic context"
          git push
